      - name: cargo clippy
        run: set -o pipefail; cargo clippy --workspace --all-targets --color never -- -A warnings 2>&1 | tee /tmp/out.log; echo "clippy ok (warnings allowed for 95% parity)"
      - name: Ekspor error sebagai anotasi
