  bench:
    name: bench (ukuran + memori + latensi)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: n8n-rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: n8n-rust
      - name: bench
        run: |
          set -o pipefail
          {
          set -e
          emit() { echo "$1"; echo "::notice::$1"; }
          cargo build --release -p n8n-server -p n8n-cli --color never
          emit "BENCH size-server=$(stat -c%s target/release/n8n-server) size-cli=$(stat -c%s target/release/n8n-cli)"
          ./target/release/n8n-server > /tmp/bench-server.log 2>&1 &
          SRV=$!
          trap 'kill $SRV 2>/dev/null' EXIT
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3000/api/nodes >/dev/null; then break; fi
            if [ "$i" = "30" ]; then echo "BENCH: server tak boot"; tail -20 /tmp/bench-server.log; exit 1; fi
            sleep 1
          done
          emit "BENCH rss-idle-kb=$(ps -o rss= -p $SRV | tr -d ' ')"
          LINE=$(python3 - <<'EOF'
          import time, urllib.request
          wf = open('fixtures/manual-to-set.json', 'rb').read()
          url = 'http://127.0.0.1:3000/api/run'
          def once():
              r = urllib.request.Request(url, data=wf, headers={'Content-Type': 'application/json'})
              return urllib.request.urlopen(r, timeout=30).read()
          once()
          ts = []
          for _ in range(50):
              t = time.perf_counter()
              once()
              ts.append((time.perf_counter() - t) * 1000)
          ts.sort()
          print(f"BENCH run-ms n=50 min={ts[0]:.2f} p50={ts[25]:.2f} p95={ts[47]:.2f} max={ts[-1]:.2f}")
          EOF
          )
          emit "$LINE"
          ./target/release/n8n-cli run fixtures/manual-to-set.json > /tmp/clirun.log 2>&1 || { echo "BENCH: cli run gagal"; cat /tmp/clirun.log; exit 1; }
          START=$(date +%s%3N)
          ./target/release/n8n-cli run fixtures/manual-to-set.json > /dev/null
          END=$(date +%s%3N)
          emit "BENCH cli-run-ms=$((END - START))"
          emit "BENCH: SELESAI"
          } 2>&1 | tee /tmp/out.log
      - name: Ekspor error sebagai anotasi
