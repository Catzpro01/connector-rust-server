              _cur += _ln + '\n'
          if _cur or not parts:
              parts.append(_cur)
          rx = re.compile(r'error|warning|Diff in|failures:|panicked|test result|FAILED', re.I)
          keep = [(i, p) for i, p in enumerate(parts)][:12] if is_fmt else [(i, p) for i, p in enumerate(parts) if rx.search(p) or i == len(parts)-1][:7]
          for i, p in keep:
              m = p.replace('%', '%25').replace(chr(13), '%0D').replace(chr(10), '%0A')
              print(f"::error::LOG[{i+1}/{len(parts)}]:{m}")
          EOF
