[package]
name = "n8n-engine"
version = "0.8.0"
edition = "2021"

[dependencies]
n8n-core = { path = "../n8n-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1.8"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
